<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b5fd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nhật ký CT">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nhật ký công trình</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--pr:#1b5fd6;--pd:#0e3f9a;--ac:#ff8a1f;--ink:#0f1b2d;--mu:#64748b;--bd:#e6eaf1;--bg:#f4f6fb;--ok:#16a34a;--rd:#e5484d;--sh:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:calc(96px + env(safe-area-inset-bottom))}
svg.ic{flex:none;vertical-align:middle}
header{background:linear-gradient(135deg,var(--pr),var(--pd));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-radius:0 0 26px 26px}
header .hs{font-size:12.5px;opacity:.8;letter-spacing:.2px}
header h1{font-size:19px;margin:2px 0 0;font-weight:700;letter-spacing:-.3px}
.pill{width:auto;max-width:40vw;border:0;border-radius:20px;padding:8px 12px;background:rgba(255,255,255,.18);color:#fff;font-size:14px;font-weight:600;appearance:none;-webkit-appearance:none;text-overflow:ellipsis}
.pill option{color:#000}
main{max-width:880px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-34px}
.st{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--sh)}
.st b{display:block;font-size:22px;line-height:1.1;color:var(--pr)}
.st span{font-size:11.5px;color:var(--mu)}
.st.w b{color:var(--rd)}
.cta{margin:14px 0 4px;border-radius:18px;padding:16px;background:linear-gradient(135deg,#fff3e6,#ffe3c4);display:flex;gap:12px;align-items:center;justify-content:space-between}
.cta b{display:block;font-size:16px}.cta span{font-size:13px;color:#8a5a1e}
.mbar{display:flex;align-items:center;gap:6px;margin:14px 0 8px}
.mbar .mt{flex:1;text-align:center;font-weight:700;font-size:16px}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:#fff;color:var(--ink);box-shadow:var(--sh);display:grid;place-items:center;padding:0;cursor:pointer}
.ib.w{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
.ent{display:flex;gap:12px;background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer;border-left:5px solid transparent;position:relative}
.ent.sv1{border-left-color:#f5b301}.ent.sv2{border-left-color:var(--ac)}.ent.sv3{border-left-color:var(--rd)}
.dt{flex:0 0 50px;text-align:center;background:var(--bg);border-radius:14px;padding:6px 0;height:max-content}
.dt b{display:block;font-size:22px;line-height:1.1}.dt span{font-size:12px;color:var(--mu);font-weight:600}
.bd{flex:1;min-width:0}
.tp{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chip{font-size:12px;font-weight:700;color:var(--pr);background:#e8f0fd;padding:2px 9px;border-radius:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.wx{font-size:12.5px;color:var(--mu)}
.tx{margin:6px 0;color:#2b3a4f;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.bg2{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bdg{display:inline-flex;gap:4px;align-items:center;font-size:12px;padding:3px 8px;border-radius:10px;background:#eef1f6;color:#44546a;font-weight:600}
.bdg.r{background:#fde8e8;color:var(--rd)}.bdg.o{background:#fff1e0;color:#c2620a}
.ths{display:flex;gap:6px;margin-top:8px}
.ths img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:#dde3ec}
.ths .more{width:64px;height:64px;border-radius:10px;background:#eef1f6;display:grid;place-items:center;font-weight:700;color:var(--mu)}
.shb{width:34px;height:34px;margin-left:auto;box-shadow:none;background:#eef1f6;color:var(--pr)}
.bal{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(135deg,#0f766e,#14b8a6);margin-top:-34px;box-shadow:var(--sh)}.bal.neg{background:linear-gradient(135deg,#b45309,#f59e0b)}.bal small{opacity:.9}.bal .big{font-size:30px;font-weight:800;line-height:1.2}
.xr{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer}
.xi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}.xi.spend{background:#fde8e8;color:var(--rd)}.xi.advance{background:#e3f6ea;color:var(--ok)}
.xb{flex:1;min-width:0}.xb b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.xb span{font-size:12.5px;color:var(--mu)}
.xa{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.xa.spend{color:var(--rd)}.xa.advance{color:var(--ok)}.xr img{width:44px;height:44px;border-radius:9px;object-fit:cover}
.bar{height:8px;border-radius:6px;background:#eef1f6;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;border-radius:6px}
.chip2.addc{border-style:dashed;color:var(--pr);border-color:var(--pr);background:#f3f7ff}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
.empty .ic{color:#b9c3d3;margin-bottom:8px}
.sec{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.sh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15.5px;margin-bottom:6px}
.sh .ic{color:var(--pr)}.sh.r .ic{color:var(--rd)}.sh.o .ic{color:var(--ac)}
.cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--mu)}
label{display:block;font-size:12.5px;color:var(--mu);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;color:var(--ink);outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--pr)}
textarea{min-height:100px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowg{display:flex;gap:8px;align-items:center}.rowg>input{flex:1}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip2{border:1.5px solid var(--bd);background:#fff;border-radius:20px;padding:7px 13px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.chip2.on{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
.chip2.sev1.on{background:#f5b301;border-color:#f5b301;color:#222}.chip2.sev2.on{background:var(--ac);border-color:var(--ac)}.chip2.sev3.on{background:var(--rd);border-color:var(--rd)}
.btn{font:inherit;border:0;border-radius:14px;padding:12px 16px;background:var(--pr);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.sec{background:#e8f0fd;color:var(--pr)}.btn.red{background:#fde8e8;color:var(--rd)}.btn.ac{background:var(--ac)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}.btn.big{width:100%;padding:15px;font-size:16.5px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.act{border:0;border-radius:16px;padding:14px 6px;background:#e8f0fd;color:var(--pr);font:inherit;font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.act:first-child{background:var(--pr);color:#fff}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.mg{grid-template-columns:repeat(3,1fr)}}
.mt2{background:var(--bg);border-radius:14px;overflow:hidden}
.pv{position:relative;aspect-ratio:4/3;background:#000;cursor:pointer}
.pv img,.pv video{width:100%;height:100%;object-fit:cover;display:block}
.pv .pen{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:10px;padding:4px 7px;font-size:11.5px;display:flex;gap:4px;align-items:center}
.pv .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;padding:0}
.pv .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.25)}
.mt2 input.cap{border:0;border-radius:0;background:transparent;font-size:13.5px;padding:9px 10px}
.hint{font-size:12.5px;color:var(--mu);margin-top:8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:520px;background:#fff;border-radius:26px;box-shadow:0 8px 30px rgba(15,27,45,.2);display:flex;align-items:center;padding:6px 6px;z-index:10}
nav button{flex:1;border:0;background:none;padding:7px 2px;font:inherit;font-size:11.5px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:600}
nav button.on{color:var(--pr)}
nav button.add{flex:0 0 62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#ff6a00);color:#fff;margin:-26px 6px 0;box-shadow:0 8px 20px rgba(255,106,0,.45);justify-content:center}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none}
#sheet .top{background:linear-gradient(135deg,var(--pr),var(--pd));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:2}
#sheet .top h2{font-size:17px;margin:0;flex:1;text-align:center}
#sheet .body{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.stickybar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:3;justify-content:center}
.stickybar .btn{flex:1;max-width:520px}.stickybar .btn.red{flex:0 0 52px;padding:12px 0}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:11px 18px;border-radius:22px;z-index:60;display:none;max-width:90%;text-align:center;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px 2px;border-radius:11px;font:inherit;font-size:14px;color:var(--mu);font-weight:600;cursor:pointer}
.seg button.on{background:#fff;color:var(--pr);box-shadow:var(--sh)}
.pnav{display:flex;align-items:center;gap:8px;margin-top:12px}
.pnav .pl{flex:1;text-align:center;font-weight:700;background:var(--bg);padding:10px;border-radius:12px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{border:0;border-radius:16px;padding:14px 4px;background:var(--bg);font:inherit;font-weight:700;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.tile .ic{color:var(--pr)}
.info{margin-top:12px;font-size:13.5px;color:var(--mu);text-align:center}
.pj{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer}
.pj .av{width:46px;height:46px;border-radius:14px;background:#e8f0fd;color:var(--pr);display:grid;place-items:center;font-weight:800;font-size:18px}
.pj b{display:block}.pj span{font-size:13px;color:var(--mu)}
.pj .n{margin-left:auto;text-align:right}
#ed{position:fixed;inset:0;background:#0b1220;z-index:40;display:none;flex-direction:column;color:#fff}
.edtop{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.edcv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
.edcv canvas{max-width:100%;max-height:100%;touch-action:none;border-radius:6px}
.edtl{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;align-items:center;justify-content:center}
.edtl button{flex:none;border:0;border-radius:12px;width:44px;height:44px;background:#1c2740;color:#fff;display:grid;place-items:center;padding:0}
.edtl button.on{background:var(--pr)}
.edtl .col{width:30px;height:30px;border-radius:50%;border:3px solid #1c2740}
.edtl .col.on{border-color:#fff}
.edcap{padding:6px 12px calc(12px + env(safe-area-inset-bottom))}
.edcap input{background:#1c2740;border-color:#2c3a5c;color:#fff}
#rv{position:fixed;inset:0;background:#8a929c;z-index:30;overflow:auto;display:none}
#rv .tb{background:#111a2b;color:#fff;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:2}
#rv .tb .btn{flex:1;min-width:90px;padding:10px 8px;font-size:14px}
.paper{background:#fff;max-width:820px;margin:10px auto;padding:22px 20px;font-family:"Times New Roman",Times,serif;font-size:14px;color:#000}
.paper h1{text-align:center;font-size:20px;margin:6px 0;color:#000;letter-spacing:0}
.paper .c{text-align:center}
.paper table{width:100%;border-collapse:collapse;margin:6px 0 10px}
.paper td,.paper th{border:1px solid #444;padding:5px 7px;vertical-align:top;text-align:left;font-size:13.5px}
.paper th{background:#e6e9ee}
.paper .dh{background:#d9e6f5;font-weight:bold;padding:6px 8px;border:1px solid #444;margin-top:14px}
.paper .ph{display:inline-block;width:48%;vertical-align:top;margin:1%;text-align:center;font-size:12px}
.paper .ph img{max-width:100%;max-height:230px;border:1px solid #888}
.paper .sg{width:100%;margin-top:26px}.paper .sg td{border:0;text-align:center;width:33%}
@media print{body>*:not(#rv){display:none!important}#rv{position:static!important;overflow:visible!important;background:#fff!important}.noprint{display:none!important}.paper{margin:0;padding:0;max-width:none}.paper .dh{page-break-after:avoid}.paper table,.paper .ph{page-break-inside:avoid}}
#syb{border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px;width:40px;height:40px;border-radius:12px;margin-left:8px}#syb.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tk{border:1.5px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px;background:#fbfcfe}
.tkr{display:flex;align-items:center;gap:10px;margin:10px 0 8px}.tkr input{flex:1;padding:0;border:0;background:none;accent-color:var(--pr)}.tkr b{min-width:46px;text-align:right}
.tst{font-size:13px;color:var(--mu);margin-top:8px}
.qk{margin-bottom:8px}.qk .chip2{font-size:13px;padding:5px 10px;background:#f7f9fc}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tpl{border:2px solid var(--bd);background:#fff;border-radius:16px;padding:8px;font:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}.tpl.on{border-color:var(--pr);box-shadow:0 0 0 3px rgba(27,95,214,.15)}.tpl svg{width:100%;height:auto;display:block;margin-bottom:4px}.tpl b{font-size:14.5px}.tpl span{font-size:12px;color:var(--mu)}
.swt{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--bd);cursor:pointer;padding:0}.sw.on{box-shadow:0 0 0 3px var(--ink)}
.sw2{display:flex;gap:12px;align-items:center;font-size:14.5px;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--bd);margin:0;font-weight:400}.sw2 input{width:22px;height:22px;flex:none}
.bp{margin-top:10px;background:#f4f7fb;border-radius:12px;padding:8px}.bpa{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bp .mg{margin-top:8px}
.act.sm{padding:9px 6px;font-size:13px;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:6px;min-height:0}
.lb2{font-size:13px;font-weight:600;color:var(--mu);margin:12px 0 0}
</style>
</head>
<body>
<header><div><div class="hs" id="sub"></div><h1 id="ttl"></h1></div><div id="hx"></div><button id="syb" onclick="syncNow(true)" style="display:none" aria-label="Đồng bộ">⟳</button></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheet"><div class="top" id="shTop"></div><div class="body" id="shB"></div></div>
<div id="ed"></div>
<div id="rv"><div class="tb noprint">
 <button class="btn sec" onclick="closeReport()">✕ Đóng</button>
 <button class="btn" onclick="doPrint()">In / Lưu PDF</button>
 <button class="btn sec" onclick="closeReport();rpOpts()">⚙ Bố cục</button>
 <button class="btn ac" onclick="dlDoc()">Tải Word</button>
</div><div class="paper" id="paper"></div></div>
<style id="rpcss"></style><input type="file" id="fLogo" accept="image/*" hidden>
<div id="toast"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fVid" accept="video/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*,video/*" multiple hidden>
<input type="file" id="fImp" accept=".zip,.json" hidden>
<script>
'use strict';
const TRIAL=false;
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const vn=s=>{const[a,b,c]=s.split('-');return c+'/'+b+'/'+a};
const WD=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'],SH=['CN','T2','T3','T4','T5','T6','T7'];
const wd=s=>WD[parseD(s).getDay()];
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'')||'file';
const SEV=['Không','Thấp','Trung bình','Cao'];
const WEATHER_B=['Nắng','Nhiều mây','Mưa nhỏ','Mưa to','Gió lớn','Nóng oi'],CATS_B=['Vật tư','Nhân công','Máy/thiết bị','Đi lại','Ăn uống','Lưu trú'];
const uniq=a=>[...new Set(a.filter(Boolean))];
const hid=k=>S['h'+k]||[];
const weatherList=cur=>uniq([...WEATHER_B,...(S.cw||[])].filter(x=>!hid('cw').includes(x)).concat(String(cur||'').split(/\s*,\s*/).filter(x=>x&&x!=='Khác'))).concat('Khác');
const catAll=()=>uniq([...CATS_B,...(S.cc||[]),...expenses.filter(x=>x.kind==='spend').map(x=>x.cat)]).filter(x=>x!=='Khác').concat('Khác');
const catList=cur=>uniq([...catAll().filter(x=>x!=='Khác'&&!hid('cc').includes(x)),cur&&cur!=='Khác'?cur:'']).concat('Khác');
/* ---------- Tuỳ chọn mới: thời tiết nhiều lựa chọn, mẫu nhanh, hạng mục, ảnh ---------- */
const WICON={'Nắng':'☀️','Nhiều mây':'⛅','Mưa nhỏ':'🌦️','Mưa to':'🌧️','Gió lớn':'💨','Nóng oi':'🌡️','Sương mù':'🌫️','Ngập nước':'🌊','Giông':'⛈️','Lạnh':'🥶'};
const wIcon=n=>WICON[n]||'🔹';
const wSplit=s=>String(s||'').split(/\s*,\s*/).filter(Boolean);

/* ngày chụp từ dữ liệu ảnh (EXIF) */
function exifTaken(buf){
 const v=new DataView(buf);if(v.byteLength<12||v.getUint16(0)!==0xFFD8)return null;
 let o=2;
 while(o+4<v.byteLength){
  const mk=v.getUint16(o),len=v.getUint16(o+2);
  if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){
   const t=o+10,le=v.getUint16(t)===0x4949,g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);let dto='',dt='';
   const str=e=>{const c=g32(e+4),off=c>4?t+g32(e+8):e+8;let s='';for(let k=0;k<c-1&&off+k<v.byteLength;k++)s+=String.fromCharCode(v.getUint8(off+k));return s};
   const rd=ifd=>{if(ifd+2>v.byteLength)return;const n=g16(ifd);for(let i=0;i<n;i++){const e=ifd+2+i*12;if(e+12>v.byteLength)break;const tag=g16(e);if(tag===0x8769)rd(t+g32(e+8));else if(tag===0x9003)dto=str(e);else if(tag===0x0132)dt=str(e)}};
   rd(t+g32(t+4));
   const m=/^(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/.exec(dto||dt);
   return m?new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]):null}
  if((mk&0xFF00)!==0xFF00||len<2)break;o+=2+len}
 return null
}
async function takenOf(f){
 try{if(f.type==='image/jpeg'||/\.jpe?g$/i.test(f.name||'')){const d=exifTaken(await f.slice(0,262144).arrayBuffer());if(d&&!isNaN(d))return d}}catch(e){}
 return f.lastModified?new Date(f.lastModified):null
}

}

async function stampImg(file,label){

 if(S.q==='orig'&&!S.stamp)return file;
 try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const[MX,QL]={std:[1600,.82],high:[2560,.92],orig:[4096,.95]}[S.q||'std'],s=Math.min(1,MX/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);const x=c.getContext('2d');x.drawImage(bmp,0,0,c.width,c.height);
  if(S.stamp){const fs=Math.max(14,Math.round(c.width/42));x.font='bold '+fs+'px Arial';const w=x.measureText(label).width;x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,c.height-fs*1.7,w+fs,fs*1.7);x.fillStyle='#fff';x.fillText(label,fs/2,c.height-fs*.5)}
  return await new Promise(r=>c.toBlob(r,'image/jpeg',QL))}catch(e){return file}
}

function edTool(t){ED.tool=t;document.querySelectorAll('#edt1 button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function edColor(c){ED.color=c;document.querySelectorAll('#edt2 .col').forEach(b=>b.classList.toggle('on',b.dataset.c===c))}
function edRedraw(){
 const cv=$('#cv'),x=cv.getContext('2d'),lw=Math.max(4,cv.width/200);x.drawImage(ED.bmp,0,0);
 for(const s of ED.cur?[...ED.shapes,ED.cur]:ED.shapes){x.strokeStyle=s.c;x.fillStyle=s.c;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';
  if(s.t==='pen'){x.beginPath();s.pts.forEach((p,k)=>k?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));if(s.pts.length===1)x.lineTo(s.pts[0].x+.1,s.pts[0].y);x.stroke()}
  else if(s.t==='rect')x.strokeRect(s.a.x,s.a.y,s.b.x-s.a.x,s.b.y-s.a.y);
  else if(s.t==='ell'){x.beginPath();x.ellipse((s.a.x+s.b.x)/2,(s.a.y+s.b.y)/2,Math.abs(s.b.x-s.a.x)/2||1,Math.abs(s.b.y-s.a.y)/2||1,0,0,7);x.stroke()}
  else if(s.t==='arrow'){const a=Math.atan2(s.b.y-s.a.y,s.b.x-s.a.x),L=lw*5;x.beginPath();x.moveTo(s.a.x,s.a.y);x.lineTo(s.b.x,s.b.y);x.stroke();x.beginPath();x.moveTo(s.b.x,s.b.y);x.lineTo(s.b.x-L*Math.cos(a-.45),s.b.y-L*Math.sin(a-.45));x.lineTo(s.b.x-L*Math.cos(a+.45),s.b.y-L*Math.sin(a+.45));x.closePath();x.fill()}
  else if(s.t==='text'){const fs=Math.max(24,cv.width/22);x.font='bold '+fs+'px Arial';x.lineWidth=fs/6;x.strokeStyle='rgba(0,0,0,.75)';x.strokeText(s.s,s.p.x,s.p.y);x.fillStyle=s.c;x.fillText(s.s,s.p.x,s.p.y)}}
}

function calcRange(){
 if(R.type==='day')return[R.anchor,R.anchor];
 if(R.type==='custom')return[R.from,R.to];
 const d=parseD(R.anchor);
 if(R.type==='week'){const s=addDays(d,-((d.getDay()+6)%7));return[iso(s),iso(addDays(s,6))]}
 return[iso(new Date(d.getFullYear(),d.getMonth(),1)),iso(new Date(d.getFullYear(),d.getMonth()+1,0))]
}
const selEntries=()=>{const[a,b]=calcRange();return entries.filter(e=>(!R.project||e.projectId===R.project)&&e.date>=a&&e.date<=b).sort((x,y)=>x.date.localeCompare(y.date)||x.created-y.created)};
async function gather(){const out=[];for(const e of selEntries()){out.push(Object.assign({},e,{media:(await mediaOf(e.id)).sort((a,b)=>a.order-b.order)}))}return out}
function periodLabel(){const[a,b]=calcRange();return{day:'Ngày '+vn(a),week:'Tuần từ '+vn(a)+' đến '+vn(b),month:'Tháng '+a.slice(5,7)+'/'+a.slice(0,4),custom:'Từ '+vn(a)+' đến '+vn(b)}[R.type]}

function pshift(n){const d=parseD(R.anchor);R.anchor=iso(R.type==='month'?new Date(d.getFullYear(),d.getMonth()+n,1):addDays(d,n*(R.type==='week'?7:1)));vRep()}

}

function shareEntryDlg(e,m){const caps=m.map(x=>x.caption);shareDialog({title:'Nhật ký '+vn(e.date),build:o=>entryText(e,caps,o),keys:EKEYS,files:m.length?async()=>toFiles(m,pname(e.projectId)+'_'+e.date):null})}
function shareCurrent(){shareEntryDlg(formEntry('x'),cur.slice())}
async function shareSaved(id){const e=entries.find(x=>x.id===id);shareEntryDlg(e,(await mediaOf(id)).sort((a,b)=>a.order-b.order))}
async function sharePeriod(withFiles){
 const data=await gather();if(!data.length)return toast('Không có nhật ký trong kỳ này');
 const all=data.flatMap(e=>e.media.filter(m=>m.type==='image'));
 if(withFiles&&all.length)S.shareOpts={...shOpts(),photos:1};
 shareDialog({title:S.title+' – '+periodLabel(),build:o=>periodText(data,o),keys:['info','act','iss','sug','sign'],files:all.length?async()=>toFiles(all,'nhatky'):null})
}
async function receiveShared(){
 try{
  const base=new URL('.',location.href).href,c=await caches.open('nk-share'),mr=await c.match(base+'shared-meta');
  history.replaceState(null,'',location.pathname);if(!mr)return;
  const meta=await mr.json(),files=[];
  for(const f of meta.files||[]){const r=await c.match(base+f.k);if(r)files.push(new File([await r.blob()],f.name||'tep',{type:f.type||r.headers.get('Content-Type')||''}))}
  for(const k of await c.keys())await c.delete(k);
  const bk=files.find(f=>/\.(zip|json)$/i.test(f.name)),media=files.filter(f=>/^(image|video)\//.test(f.type)||/\.(jpe?g|png|webp|heic|mp4|mov|webm)$/i.test(f.name));
  const text=[meta.title,meta.text,meta.url].filter(Boolean).join('\n').trim();
  if(bk&&await askc('Nhập dữ liệu nhật ký từ tệp "'+bk.name+'"? Dữ liệu cùng mã sẽ được cập nhật.',0,'Nhập')){await importData(bk);return}
  if(media.length||text){await openEntry(null,{text,files:media});toast('Đã nhận '+(media.length?media.length+' tệp':'nội dung')+'. Chọn dự án rồi bấm Lưu.',5000)}
 }catch(e){toast('Không nhận được nội dung chia sẻ')}
}

/* ---------- Đồng bộ SharePoint (Microsoft Graph) ---------- */
const SY_SCOPE='Sites.Selected User.Read offline_access';
const syCfg=()=>S.sync||{};
const syRedirect=()=>location.origin+location.pathname.replace(/index\.html$/,'');
const syOn=()=>{const c=syCfg();return !!(c.tenant&&c.client&&c.site)};
let TK=null;try{TK=JSON.parse(localStorage.getItem('nk_tok')||'null')}catch(e){}
let SYD={};try{SYD=JSON.parse(localStorage.getItem('nk_sy')||'{}')}catch(e){}
const saveTK=()=>{try{TK?localStorage.setItem('nk_tok',JSON.stringify(TK)):localStorage.removeItem('nk_tok')}catch(e){}};
const saveSYD=()=>{try{localStorage.setItem('nk_sy',JSON.stringify(SYD))}catch(e){}};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const syAuth=()=>`https://login.microsoftonline.com/${encodeURIComponent(syCfg().tenant)}/oauth2/v2.0/`;
async function syLogin(){
 if(!syOn())return toast('Nhập đủ Tenant ID, Client ID và địa chỉ site');
 const v=b64u(crypto.getRandomValues(new Uint8Array(32))),ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v))),st=b64u(crypto.getRandomValues(new Uint8Array(12)));
 try{localStorage.setItem('nk_pkce',JSON.stringify({v,st}))}catch(e){}
 location.href=syAuth()+'authorize?'+new URLSearchParams({client_id:syCfg().client,response_type:'code',redirect_uri:syRedirect(),response_mode:'query',scope:SY_SCOPE,code_challenge:ch,code_challenge_method:'S256',state:st,prompt:'select_account'})
}
async function syTokenReq(p){
 const r=await fetch(syAuth()+'token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:syCfg().client,scope:SY_SCOPE,...p})});
 const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error||'Lỗi đăng nhập');
 TK={...(TK||{}),access:j.access_token,refresh:j.refresh_token||(TK&&TK.refresh),exp:Date.now()+(j.expires_in-120)*1000};saveTK()
}
async function syCallback(){
 const q=new URLSearchParams(location.search);if(!q.get('code')&&!q.get('error'))return;
 let pk=null;try{pk=JSON.parse(localStorage.getItem('nk_pkce')||'null')}catch(e){}
 const code=q.get('code'),err=q.get('error_description')||q.get('error'),st=q.get('state');
 history.replaceState(null,'',location.pathname);try{localStorage.removeItem('nk_pkce')}catch(e){}
 if(err)return toast('Đăng nhập lỗi: '+err.slice(0,120),6000);
 if(!pk||pk.st!==st)return toast('Phiên đăng nhập không hợp lệ, thử lại',5000);
 try{await syTokenReq({grant_type:'authorization_code',code,redirect_uri:syRedirect(),code_verifier:pk.v});
  const me=await syGraph('/me?$select=displayName,userPrincipalName');TK.name=me.displayName;TK.upn=me.userPrincipalName;saveTK();
  S.sync.siteId='';saveS();tab='set';toast('Đã đăng nhập: '+TK.name);syncSoon(500)
 }catch(e){toast('Không đăng nhập được: '+e.message,6000)}
}
async function syToken(){
 if(!TK||!TK.refresh)throw new Error('Chưa đăng nhập');
 if(!TK.access||Date.now()>TK.exp)await syTokenReq({grant_type:'refresh_token',refresh_token:TK.refresh});
 return TK.access
}
async function syGraph(path,opt={},raw){
 const go=async()=>fetch(path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path,{...opt,headers:{Authorization:'Bearer '+await syToken(),...(opt.headers||{})}});
 let r=await go();if(r.status===401){TK.exp=0;r=await go()}
 if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}const x=new Error(r.status===403?'Chưa được cấp quyền vào site (403). Nhờ IT làm Bước 3.':r.status+' '+m.slice(0,100));x.status=r.status;throw x}
 return raw?r:(r.status===204?{}:r.json())
}
async function syTarget(){
 const c=syCfg();if(c.siteId&&c.driveId)return c;
 const u=new URL(c.site);const s=await syGraph(`/sites/${u.hostname}:${u.pathname.replace(/\/$/,'')}`),d=await syGraph(`/sites/${s.id}/drive`);
 S.sync.siteId=s.id;S.sync.driveId=d.id;saveS();return S.sync
}
const syClean=s=>String(s||'').replace(/[\\/:*?"<>|#%~]+/g,' ').replace(/\s+/g,' ').trim().replace(/[. ]+$/,'')||'khac';
const syUser=()=>syClean((TK&&TK.name||'')+' - '+(TK&&TK.upn||'').split('@')[0]);
const syPath=p=>p.split('/').map(encodeURIComponent).join('/');
async function syPut(drive,path,data,mime){
 const body=data instanceof Blob?data:new Blob([data],{type:mime||'application/json'});
 if(body.size<=4*1024*1024){await syGraph(`/drives/${drive}/root:/${syPath(path)}:/content`,{method:'PUT',headers:{'Content-Type':mime||body.type||'application/octet-stream'},body});return}
 const ses=await syGraph(`/drives/${drive}/root:/${syPath(path)}:/createUploadSession`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item:{'@microsoft.graph.conflictBehavior':'replace'}})}),CH=320*1024*10;
 for(let o=0;o<body.size;o+=CH){const e=Math.min(o+CH,body.size),r=await fetch(ses.uploadUrl,{method:'PUT',headers:{'Content-Range':`bytes ${o}-${e-1}/${body.size}`},body:body.slice(o,e)});if(!r.ok&&r.status!==202)throw new Error('Tải video lỗi '+r.status)}
}
const syStamp=x=>String(x.updated||x.created||0);
let syBusy=false,syTimer=0;
async function syncNow(manual){
 if(syBusy)return;
 if(!syOn()||!TK){if(manual)toast('Chưa cài đặt hoặc chưa đăng nhập SharePoint');return}
 if(!navigator.onLine){if(manual)toast('Đang offline, sẽ đồng bộ khi có mạng');return}
 syBusy=true;syUI('Đang đồng bộ…');let n=0,fail=0,last='';
 try{
  const t=await syTarget(),root='NhatKy/'+syUser(),pn=id=>{const p=projects.find(x=>x.id===id);return p?syClean(p.name):'Khong_ro_du_an'};
  const todo=[];
  for(const p of projects)todo.push({k:'p'+p.id,st:JSON.stringify([p.name,p.code,p.client,p.address]),f:async()=>syPut(t.driveId,`${root}/${syClean(p.name)}/du_an.json`,JSON.stringify({app:'nhatky-ct',...p},null,1))});
  for(const e of entries)todo.push({k:'e'+e.id,st:syStamp(e),f:async()=>{
   const dir=`${root}/${pn(e.projectId)}/${e.date}_${e.id.slice(-6)}`,ms=(await mediaOf(e.id)).sort((a,b)=>a.order-b.order),files=[];
   for(let i=0;i<ms.length;i++){const m=ms[i],nm=String(i+1).padStart(2,'0')+'.'+(m.ext||(m.type==='video'?'mp4':'jpg'));await syPut(t.driveId,`${dir}/${nm}`,m.blob,m.mime);files.push({file:nm,type:m.type,caption:m.caption||'',tag:m.tag||''})}
   const {thumbs,...rest}=e;await syPut(t.driveId,`${dir}/nhat_ky.json`,JSON.stringify({app:'nhatky-ct',project:pn(e.projectId),...rest,media:files},null,1))}});
  for(const x of expenses)todo.push({k:'x'+x.id,st:syStamp(x),f:async()=>{
   const dir=`${root}/${pn(x.projectId)}/ChiTieu/${x.date}_${x.id.slice(-6)}`,ms=(await mediaOf(x.id)).sort((a,b)=>a.order-b.order),files=[];
   for(let i=0;i<ms.length;i++){const m=ms[i],nm=String(i+1).padStart(2,'0')+'.'+(m.ext||'jpg');await syPut(t.driveId,`${dir}/${nm}`,m.blob,m.mime);files.push({file:nm,caption:m.caption||''})}
   const {thumb,...rest}=x;await syPut(t.driveId,`${dir}/chi_tieu.json`,JSON.stringify({app:'nhatky-ct',project:pn(x.projectId),...rest,media:files},null,1))}});
  const pending=todo.filter(o=>SYD[o.k]!==o.st);
  for(let i=0;i<pending.length;i++){const o=pending[i];syUI(`Đang đồng bộ ${i+1}/${pending.length}…`);
   try{await o.f();SYD[o.k]=o.st;saveSYD();n++}catch(e){if(e.status===403||e.status===401)throw e;fail++;last=e.message}}
  S.sync.last=Date.now();saveS();
  if(manual||n||fail)toast(fail?`Đồng bộ ${n} mục, lỗi ${fail}: ${last}`:n?`Đã đồng bộ ${n} mục lên SharePoint`:'Mọi thứ đã được đồng bộ',4500)
 }catch(e){if(/Chưa đăng nhập|invalid_grant|AADSTS/.test(e.message)){TK=null;saveTK()}toast('Đồng bộ lỗi: '+e.message,6500)}
 finally{syBusy=false;syUI();if(tab==='set')render()}
}
function syncSoon(ms=3000){if(!syOn()||!TK||!S.sync.auto)return;clearTimeout(syTimer);syTimer=setTimeout(()=>syncNow(false),ms)}
function syUI(msg){
 const b=$('#syb');if(b){b.style.display=(syOn()&&TK)?'':'none';b.classList.toggle('spin',syBusy);b.title=msg||'Đồng bộ ngay'}
 const e=$('#syst');if(e&&msg)e.textContent=msg
}
function saveSync(){
 const g=id=>$('#sy_'+id).value.trim();
 const nw={tenant:g('tenant'),client:g('client'),site:g('site').replace(/\/+$/,''),auto:$('#sy_auto').checked};
 const ch=nw.tenant!==syCfg().tenant||nw.client!==syCfg().client||nw.site!==syCfg().site;
 S.sync={...syCfg(),...nw};if(ch){S.sync.siteId='';S.sync.driveId='';TK=null;saveTK();SYD={};saveSYD()}
 saveS();toast('Đã lưu cấu hình đồng bộ');render()
}
function syOut(){TK=null;saveTK();toast('Đã đăng xuất Microsoft');render()}
function syncSec(){
 const c=syCfg(),ok=syOn(),last=c.last?new Date(c.last).toLocaleString('vi-VN'):'chưa lần nào';
 const pend=TK?[...projects.map(p=>'p'+p.id),...entries.map(e=>'e'+e.id),...expenses.map(x=>'x'+x.id)].length:0;
 return `<div class="sec"><div class="sh">${ic('share')}Đồng bộ SharePoint</div>
 <p class="hint" style="margin-top:0">Mỗi kỹ sư có một thư mục riêng <b>NhatKy / Tên - tài khoản</b> trên site chung. Nhật ký, chi tiêu, ảnh và video được tải lên theo dự án và ngày.</p>
 ${TK?`<div class="hint" style="color:var(--ink)">Đã đăng nhập: <b>${esc(TK.name||'')}</b> (${esc(TK.upn||'')})<br>Lần đồng bộ gần nhất: ${last}<br><span id="syst"></span></div>
 <div class="tiles" style="grid-template-columns:1fr 1fr"><button class="tile" onclick="syncNow(true)">${ic('upload',26)}Đồng bộ ngay</button><button class="tile" onclick="syOut()">${ic('trash',26)}Đăng xuất</button></div>`:
 `<button class="btn big" onclick="syLogin()" ${ok?'':'disabled'}>${ic('check')} Đăng nhập Microsoft 365</button>`}
 <details style="margin-top:14px" ${ok?'':'open'}><summary style="font-weight:600;cursor:pointer">Cấu hình (do IT cung cấp)</summary>
 <label>Tenant ID</label><input id="sy_tenant" value="${esc(c.tenant||'')}" autocapitalize="off">
 <label>Client ID</label><input id="sy_client" value="${esc(c.client||'')}" autocapitalize="off">
 <label>Địa chỉ site SharePoint</label><input id="sy_site" placeholder="https://congty.sharepoint.com/sites/NhatKyCongTrinh" value="${esc(c.site||'')}" autocapitalize="off">
 <label style="display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" id="sy_auto" style="width:22px;height:22px" ${c.auto!==false?'checked':''}> Tự động đồng bộ sau khi lưu và khi có mạng</label>
 <p class="hint">Redirect URI cần đăng ký (loại SPA): <b style="user-select:all;word-break:break-all">${esc(syRedirect())}</b></p>
 <button class="btn" onclick="saveSync()">${ic('check')} Lưu cấu hình</button></details></div>`
}
window.addEventListener('online',()=>syncSoon(1500));

/* ---------- Khởi động ---------- */
(async()=>{
 try{db=await openDB()}catch(e){MEM={projects:new Map(),entries:new Map(),media:new Map(),expenses:new Map()}}
 await syCallback();await load();syUI();
 if(TRIAL&&!projects.length)await seedDemo();
 render();
 if(/[?&]shared=1/.test(location.search)&&projects.length)receiveShared();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})
})();
</script>
